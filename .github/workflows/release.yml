name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x ./mvnw

      - name: Build distribution zip
        run: ./mvnw --batch-mode --no-transfer-progress clean package

      - name: Verify distribution zip
        run: test -f target/java-tool-example.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/java-tool-example.zip --generate-notes --title "$GITHUB_REF_NAME"
